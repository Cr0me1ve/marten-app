essential: false
icon: assets/images/source/ic_launcher_border.png

# Post-installation tasks:
# 1. Inject StartupWMClass into the system .desktop file for correct icon association
# 2. Remove conflicting marten.desktop files from users' .local directories (cleanup AppImage artifacts)
# 3. Update the desktop database to apply changes immediately
postinstall_scripts:
  - echo "Setting up Marten..."
  - sed -i '/^\[Desktop Entry\]/a StartupWMClass=app.marten.client' "/usr/share/applications/marten.desktop"
  - echo "Search and remove marten.desktop from .local"
  - for user_dir in /home/*; do if [ -f "$user_dir/.local/share/applications/marten.desktop" ]; then rm -f "$user_dir/.local/share/applications/marten.desktop"; echo "Found and removed marten.desktop from $user_dir .local"; fi; done
  - update-desktop-database /usr/share/applications
  - echo "Marten is ready to use :)"

# Post-uninstallation tasks:
# 1. Iterate through all user directories to remove Marten configuration and data
# 2. Clean up root user data to ensure a clean removal
postuninstall_scripts:
  - echo "Removing Marten user data..."
  - for user_dir in /home/*; do if [ -d "$user_dir/.local/share/marten" ]; then rm -rf "$user_dir/.local/share/marten"; echo "Removed data from $user_dir"; fi; done
  - rm -rf /root/.local/share/marten
  - echo "Marten data cleanup complete."

