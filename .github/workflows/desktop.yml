name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.5"
  CORE_RELEASE_TAG: "core-desktop-0.7.8"
  LINUX_CORE_ARCHIVE: "marten-core-linux-amd64-20260818.tar.gz"
  LINUX_CORE_SHA256: "ae17263c06cd3d8e64a9d6b4be2c465a3b73881bd51077f99fadb7c052a757fc"
  WINDOWS_CORE_ARCHIVE: "marten-core-windows-amd64-20260818.tar.gz"
  WINDOWS_CORE_SHA256: "4de67e0e6b32c571b53092810693e59d9715efc1e4294ac26e6e80ebdba3b317"

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            libayatana-appindicator3-dev libsqlite3-dev libcurl4-openssl-dev \
            libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download and verify pinned Linux core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p marten-core/bin
          gh release download "${CORE_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${LINUX_CORE_ARCHIVE}" \
            --dir "${RUNNER_TEMP}" \
            --clobber
          echo "${LINUX_CORE_SHA256}  ${RUNNER_TEMP}/${LINUX_CORE_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${LINUX_CORE_ARCHIVE}" -C marten-core/bin

      - name: Generate Flutter sources
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Run Flutter tests
        run: flutter test

      - name: Build Linux release
        shell: bash
        run: flutter build linux --release --target lib/main_prod.dart --dart-define=release=github

      - name: Verify and package Linux x86_64 bundle
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          BUNDLE="build/linux/x64/release/bundle"
          test -x "${BUNDLE}/marten"
          test -x "${BUNDLE}/MartenCli"
          test -s "${BUNDLE}/lib/marten-core.so"

          file "${BUNDLE}/marten" "${BUNDLE}/MartenCli" "${BUNDLE}/lib/marten-core.so" | tee linux-architecture.txt
          grep -Fq "x86-64" linux-architecture.txt
          readelf -h "${BUNDLE}/marten" | grep -Fq "Advanced Micro Devices X86-64"
          readelf -h "${BUNDLE}/MartenCli" | grep -Fq "Advanced Micro Devices X86-64"
          readelf -h "${BUNDLE}/lib/marten-core.so" | grep -Fq "Advanced Micro Devices X86-64"

          mkdir -p release
          ARCHIVE="marten-${VERSION}-${SHORT_SHA}-linux-x86_64.tar.gz"
          tar -czf "release/${ARCHIVE}" -C "${BUNDLE}" .
          sha256sum "release/${ARCHIVE}" > "release/${ARCHIVE}.sha256"
          cp linux-architecture.txt release/
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "flutter_version=${FLUTTER_VERSION}"
            echo "target=linux-x86_64"
            echo "core_archive_sha256=${LINUX_CORE_SHA256}"
            echo "marten_core_revision=777a837f7f3fc2113588d06ed9fa898880227642"
            echo "marten_sing_box_revision=c18a7ec12ab1e204d75d9050ffd1e72f9d09de4d"
            echo "turncoat_revision=29ba26b97c3c62a9aa7da7f8a4d5bd04a36e1622"
          } > release/build-metadata.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: marten-linux-x86_64-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download and verify pinned Windows core
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "marten-core/bin" | Out-Null
          gh release download $env:CORE_RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:WINDOWS_CORE_ARCHIVE `
            --dir $env:RUNNER_TEMP `
            --clobber
          $archive = Join-Path $env:RUNNER_TEMP $env:WINDOWS_CORE_ARCHIVE
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:WINDOWS_CORE_SHA256) {
            throw "Windows core SHA256 mismatch: $actual"
          }
          tar -xzf $archive -C "marten-core/bin"

      - name: Generate Flutter sources
        shell: pwsh
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --target lib/main_prod.dart --dart-define=release=github

      - name: Verify and package Windows x64 bundle
        shell: pwsh
        run: |
          function Assert-PeX64([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Seek(0x3c, [System.IO.SeekOrigin]::Begin) | Out-Null
              $peOffset = $reader.ReadInt32()
              $stream.Seek($peOffset + 4, [System.IO.SeekOrigin]::Begin) | Out-Null
              $machine = $reader.ReadUInt16()
              if ($machine -ne 0x8664) {
                throw "$Path is not PE x64 (machine=0x$($machine.ToString('x4')))"
              }
            } finally {
              $stream.Dispose()
            }
          }

          $version = ((Get-Content pubspec.yaml | Select-String '^version: ([^+]+)').Matches[0].Groups[1].Value)
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $bundle = "build/windows/x64/runner/Release"
          $binaries = @(
            (Join-Path $bundle "Marten.exe"),
            (Join-Path $bundle "MartenCli.exe"),
            (Join-Path $bundle "marten-core.dll")
          )
          foreach ($binary in $binaries) {
            if (!(Test-Path $binary -PathType Leaf)) { throw "Missing $binary" }
            Assert-PeX64 $binary
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $archiveName = "marten-$version-$shortSha-windows-x64.zip"
          $archive = Join-Path release $archiveName
          Compress-Archive -Path "$bundle/*" -DestinationPath $archive -CompressionLevel Optimal
          $archiveHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$archiveHash  $archiveName" | Set-Content -NoNewline (Join-Path release "$archiveName.sha256")
          $binaries | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()
            "$hash  $($_.Substring($bundle.Length + 1))"
          } | Set-Content (Join-Path release "windows-binary-sha256.txt")
          @(
            "source_commit=$env:GITHUB_SHA",
            "flutter_version=$env:FLUTTER_VERSION",
            "target=windows-x64",
            "core_archive_sha256=$env:WINDOWS_CORE_SHA256",
            "marten_core_revision=777a837f7f3fc2113588d06ed9fa898880227642",
            "marten_sing_box_revision=c18a7ec12ab1e204d75d9050ffd1e72f9d09de4d",
            "turncoat_revision=29ba26b97c3c62a9aa7da7f8a4d5bd04a36e1622"
          ) | Set-Content (Join-Path release "build-metadata.txt")

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: marten-windows-x64-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
