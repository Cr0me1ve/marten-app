
plugins { 
    id "com.android.application" 
    id "com.google.gms.google-services" apply false
    id "com.google.firebase.crashlytics" apply false
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin" 
    id "com.google.protobuf" version "0.9.4" 
    id "com.squareup.wire" version "5.3.1"
}

def hasFirebaseConfig = file("google-services.json").exists()
if (hasFirebaseConfig) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

boolean hasKeyStore = false
// Explicit local tester build only; normal APK/AAB builds remain passive.
def energyDiagnostics = providers.gradleProperty('martenEnergyDiagnostics').orNull == 'true'

def martenCoreAar = file('libs/marten-core.aar')
def martenCoreCrashlyticsSymbolsDir = file("$buildDir/intermediates/marten_core_crashlytics_symbols/release")
def extractMartenCoreCrashlyticsSymbols = tasks.register('extractMartenCoreCrashlyticsSymbols', Sync) {
    inputs.file(martenCoreAar)
    from(zipTree(martenCoreAar)) {
        include 'jni/arm64-v8a/libmarten-core.so'
    }
    into(martenCoreCrashlyticsSymbolsDir)
}
def validateMartenCoreCrashlyticsSymbols = tasks.register('validateMartenCoreCrashlyticsSymbols') {
    dependsOn(extractMartenCoreCrashlyticsSymbols)
    def nativeLibrary = file("$martenCoreCrashlyticsSymbolsDir/jni/arm64-v8a/libmarten-core.so")
    inputs.file(nativeLibrary)
    doLast {
        if (!nativeLibrary.isFile()) {
            throw new GradleException("Missing extracted Crashlytics symbols: $nativeLibrary")
        }
        def readelf = fileTree(android.ndkDirectory) {
            include 'toolchains/llvm/prebuilt/*/bin/llvm-readelf*'
        }.files.find { it.canExecute() }
        if (readelf == null) {
            throw new GradleException("llvm-readelf is missing from Android NDK ${android.ndkDirectory}")
        }
        def inspect = { String argument ->
            def process = new ProcessBuilder(readelf.absolutePath, argument, nativeLibrary.absolutePath)
                .redirectErrorStream(true)
                .start()
            def output = process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException("llvm-readelf $argument failed for $nativeLibrary:\n$output")
            }
            output
        }
        def sections = inspect('-S')
        if (!sections.contains('.debug_info') || !sections.contains('.symtab')) {
            throw new GradleException(
                'libmarten-core.so is stripped; rebuild the AAR with DWARF and the ELF symbol table before uploading Crashlytics symbols',
            )
        }
        if (!inspect('-n').contains('NT_GNU_BUILD_ID')) {
            throw new GradleException('libmarten-core.so has no GNU Build ID required by Crashlytics')
        }
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No keystore defined. The app will not be signed."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}
if (energyDiagnostics && !hasKeyStore) {
    throw new GradleException('Energy diagnostic APK requires the configured Marten signing key')
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')?: '1'

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Keep one canonical CAPTCHA driver. The service-only Android path cannot
// execute Dart after a cold Quick Settings start, so package the exact script
// already used by CaptchaPage as a generated APK asset.
def captchaAutomationSource = rootProject.file('../lib/features/captcha/widget/captcha_page.dart')
def generatedCaptchaAssetsDirectory = file("$buildDir/generated/martenCaptchaAssets")
def generatedCaptchaAutomationAsset = file("$generatedCaptchaAssetsDirectory/marten_captcha_automation.js")
def generateCaptchaAutomationAsset = tasks.register('generateCaptchaAutomationAsset') {
    inputs.file(captchaAutomationSource)
    outputs.file(generatedCaptchaAutomationAsset)
    doLast {
        def source = captchaAutomationSource.getText('UTF-8')
        def startMarker = "const _captchaAutomationScript = '''\n"
        def endMarker = "\n''';"
        def start = source.indexOf(startMarker)
        def end = start < 0 ? -1 : source.indexOf(endMarker, start + startMarker.length())
        if (start < 0 || end < 0) {
            throw new GradleException('Unable to extract the canonical CAPTCHA automation script')
        }
        generatedCaptchaAutomationAsset.parentFile.mkdirs()
        generatedCaptchaAutomationAsset.setText(
            source.substring(start + startMarker.length(), end),
            'UTF-8',
        )
    }
}

android {
    namespace 'app.marten.client'
    testNamespace "test.app.marten.client"
    if (energyDiagnostics) {
        testBuildType 'profile'
    }
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.assets.srcDir(generatedCaptchaAssetsDirectory)
    }

    defaultConfig {
        applicationId "app.marten.client"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'ENERGY_DIAGNOSTICS', energyDiagnostics.toString()
        if (energyDiagnostics) {
            ndk { abiFilters 'arm64-v8a' }
            externalNativeBuild {
                cmake {
                    arguments "-DMARTEN_JVM_INCLUDE=${providers.gradleProperty('martenJvmtiInclude').orNull ?: System.getProperty('java.home') + '/include'}", '-DANDROID_STL=c++_static'
                }
            }
        }
    }

    if (energyDiagnostics) {
        externalNativeBuild {
            cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
        }
    }

    packagingOptions {
        jniLibs {
            //noinspection ChromeOsAbiSupport
            excludes += ["lib/x86_64/**", "lib/x86/**", "lib/armeabi-v7a/**"]
            useLegacyPackaging = true
        }
    }

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            if (hasFirebaseConfig) {
                firebaseCrashlytics {
                    // libmarten-core.so is supplied by the prebuilt AAR rather than
                    // externalNativeBuild, so Crashlytics cannot discover its
                    // symbols from a CMake/ndk-build model. The extraction task
                    // exposes the exact unstripped library packaged by this build.
                    nativeSymbolUploadEnabled true
                    unstrippedNativeLibsDir file("$buildDir/intermediates/marten_core_crashlytics_symbols/release")
                }
            }
        }
        profile {
            // Flutter treats a debuggable release variant as debug/JIT. Its
            // profile variant explicitly keeps AOT with local profiling tools.
            if (energyDiagnostics) {
                signingConfig signingConfigs.release
                debuggable true
            }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        aidl true
    }

}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn(generateCaptchaAutomationAsset)
}

if (hasFirebaseConfig) {
    tasks.matching {
        it.name == 'generateCrashlyticsSymbolFileRelease' ||
            it.name == 'uploadCrashlyticsSymbolFileRelease'
    }.configureEach {
        dependsOn(validateMartenCoreCrashlyticsSymbols)
    }

    tasks.matching {
        it.name == 'assembleRelease' || it.name == 'bundleRelease'
    }.configureEach {
        // A release artifact without matching native symbols makes a captured
        // libmarten-core.so crash unactionable. Keep symbol upload inside both
        // APK and AAB release task graphs so an upload failure fails the build.
        dependsOn('uploadCrashlyticsSymbolFileRelease')
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = android.defaultConfig.versionCode
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // Expose the same Crashlytics Android SDK used by FlutterFire to native
    // startup/service diagnostics without introducing Firebase Analytics.
    implementation platform("com.google.firebase:firebase-bom:${project(':firebase_core').properties['FirebaseSDKVersion']}")
    implementation 'com.google.firebase:firebase-crashlytics-ndk'

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    // The app owns WorkManager's fail-closed WorkerFactory; declare the same
    // runtime used by workmanager_android on the app compile classpath.
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation("com.squareup.wire:wire-grpc-client:5.3.1")

    implementation 'io.grpc:grpc-okhttp:1.64.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
//    protoPath(project(':marten_api'))
//    implementation project(':marten_api')




}
