group 'app.marten.native_resume'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

dependencies {
    // The app packages this AAR at runtime. compileOnly keeps the plugin from
    // embedding a second native core while making the pure subscription
    // canonicalizer available to headless Flutter engines.
    compileOnly files('../../../android/app/libs/marten-core.aar')
}

android {
    namespace 'app.marten.native_resume'
    compileSdk = flutter.compileSdkVersion

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion flutter.minSdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
